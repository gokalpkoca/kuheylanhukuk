    <!-- LCP: instant splash assets -->
    <link rel="preload" as="image" href="/loading-logo.png" fetchpriority="high">
    <style>
      #initial-splash {
        transition: opacity 0.45s ease;
        position: fixed;
        inset: 0;
        z-index: 9998;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #initial-splash.is-hidden { opacity: 0; pointer-events: none; }
      #initial-splash img {
        opacity: 0;
        animation: splash-in 0.6s ease-out 0.06s forwards;
      }
      #initial-splash .splash-rule {
        margin-top: 32px;
        height: 2px;
        width: 264px;
        background: #A80B06;
        border-radius: 999px;
        transform: scaleX(0);
        transform-origin: center;
        animation: splash-rule 0.9s ease-in-out 1.02s forwards;
      }
      @keyframes splash-rule { to { transform: scaleX(1); } }
      @keyframes splash-in { to { opacity: 1; } }
      #initial-splash p {
        margin: 24px 0 0;
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-size: 20px;
        line-height: 28px;
        height: 28px;
        letter-spacing: 0.1em;
        color: #413432;
        opacity: 0;
        animation: splash-in 0.6s ease-out 0.54s forwards;
      }
